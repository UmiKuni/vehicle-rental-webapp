# ==============================================================================
# GitHub Actions: Backend Continuous Deployment (Staging)
# ==============================================================================
# Deploys `be/Dockerfile` to Azure Container Apps (staging) on pushes to `main`
# or `dev` that affect `be/`, or when triggered manually via workflow_dispatch.
#
# Required GitHub Repository Secret:
#   - AZURE_CREDENTIALS : JSON output of `az ad sp create-for-rbac --sdk-auth`
#                         scoped to `rg-carrental-staging` with Contributor role.
#
# Notes for Azure for Students:
#   - Builds on the GitHub runner (not `az acr build`, as ACR Tasks are disabled).
#   - Uses `az containerapp revision copy` (avoids Express identity update error).
# ==============================================================================

name: "Backend CD (Staging)"

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "be/**"
      - ".github/workflows/backend-cd-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd-staging
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: "rg-carrental-staging"
  ACR_NAME: "carrentalstagingacr"
  ACR_LOGIN_SERVER: "carrentalstagingacr.azurecr.io"
  IMAGE_NAME: "carrental-api"
  CONTAINER_APP_NAME: "carrental-staging-api"

jobs:
  build-and-deploy:
    name: "Build, Push & Deploy to Staging"
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./be
          file: ./be/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy new revision to Azure Container Apps
        run: |
          az containerapp revision copy \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Print Staging URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Deployed to: https://${FQDN}"
